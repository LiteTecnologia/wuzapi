apiVersion: apps/v1
kind: Deployment
metadata:
  name: wuzapi
  namespace: wuzapi-staging
  labels:
    app: wuzapi
spec:
  replicas: 1
  strategy:
    type: Recreate  # 1 réplica + sessões persistidas no postgres — RollingUpdate causaria reconexões
  selector:
    matchLabels:
      app: wuzapi
  template:
    metadata:
      labels:
        app: wuzapi
    spec:
      # Pod Security Standards "restricted" — RKE2 enforce no nível mais alto.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Sanity check: o postgres compartilhado (192.168.110.210) está alcançável?
      # Falha rápido se houver problema de rede/firewall em vez de crashloop misterioso do wuzapi.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: wuzapi-config
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 30); do
                pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" && exit 0
                echo "Aguardando postgres em $DB_HOST:$DB_PORT (tentativa $i/30)..."
                sleep 2
              done
              echo "Postgres compartilhado inalcançável após 60s"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: artifact-registry
      containers:
        - name: wuzapi
          image: southamerica-east1-docker.pkg.dev/nexodin-liteti/liteti/wuzapi:liteti-staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: wuzapi-config
            - secretRef:
                name: wuzapi-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      restartPolicy: Always
