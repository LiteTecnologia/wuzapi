apiVersion: v1
kind: ConfigMap
metadata:
  name: wuzapi-config
  namespace: wuzapi-staging
data:
  # Connection
  WUZAPI_PORT: "8080"
  WUZAPI_ADDRESS: "0.0.0.0"
  TZ: "America/Sao_Paulo"

  # Postgres compartilhado da Liteti (192.168.110.210)
  # Database `wuzapi` e user `wuzapi` provisionados manualmente — ver README.md.
  DB_HOST: "192.168.110.210"
  DB_PORT: "5432"
  DB_USER: "wuzapi"
  DB_NAME: "wuzapi"

  # WhatsApp session
  SESSION_DEVICE_NAME: "WuzAPI Liteti Staging"

  # Webhook
  WEBHOOK_FORMAT: "json"
  WEBHOOK_RETRY_ENABLED: "true"
  WEBHOOK_RETRY_COUNT: "3"
  WEBHOOK_RETRY_DELAY_SECONDS: "5"

  # Logging
  WUZAPI_LOG_LEVEL: "info"

  # Event bus (RabbitMQ self-hosted no namespace devtools)
  # Credenciais via Secret (RABBITMQ_URL); só URL base aqui é redundante,
  # então o secret tem a URL completa amqp://admin:PASS@host:5672/
  RABBITMQ_QUEUE: "whatsapp_events"
  WEBHOOK_ERROR_QUEUE_NAME: "webhook_errors"

  # Observability — Sentry/GlitchTip (SENTRY_DSN injetado via secret quando configurado)
  SENTRY_ENVIRONMENT: "staging"
