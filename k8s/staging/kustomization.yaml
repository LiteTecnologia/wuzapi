apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wuzapi-staging

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.template.yaml NÃO é incluído aqui — secrets reais via sync-secrets
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - wuzapi-deployment.yaml
  - wuzapi-service.yaml

commonLabels:
  app.kubernetes.io/managed-by: liteti
  environment: staging
