apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wuzapi-staging

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.template.yaml NÃO é incluído aqui — secrets reais via sync-secrets
  # Postgres é o compartilhado da Liteti (192.168.110.210), não rodamos no cluster.
  # Database/user provisionados manualmente — ver README.md.
  - wuzapi-deployment.yaml
  - wuzapi-service.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: liteti
      environment: staging
