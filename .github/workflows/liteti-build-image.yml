# Build & push wuzapi image for Liteti staging.
#
# Aciona em qualquer push pra uma branch `liteti/**` (overlay Liteti) ou via dispatch manual.
# Publica em GHCR sob o org dono do fork (LiteTecnologia).
#
# Tags geradas:
#   - liteti-staging       (rolling, sempre o último build)
#   - liteti-<sha>         (imutável por commit, p/ rollback)

name: liteti-build-image

on:
  push:
    branches:
      - 'liteti/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: liteti-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/litetecnologia/wuzapi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=liteti-staging
            type=sha,prefix=liteti-,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
