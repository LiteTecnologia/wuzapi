# Build & push wuzapi image to Liteti's Google Artifact Registry.
#
# Aciona em qualquer push pra uma branch `liteti/**` (overlay Liteti) ou via dispatch manual.
# Autentica via WIF (sem service account key estática).
#
# Tags geradas:
#   - liteti-staging       (rolling, sempre o último build)
#   - liteti-<sha>         (imutável por commit, p/ rollback)

name: liteti-build-image

on:
  push:
    branches:
      - 'liteti/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for WIF

concurrency:
  group: liteti-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT: nexodin-liteti
  GCP_REGION: southamerica-east1
  GAR_REPO: liteti
  IMAGE_NAME: wuzapi
  GCP_WIF_PROVIDER: projects/277985200423/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  GCP_WIF_SA: github-cicd@nexodin-liteti.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for GAR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=liteti-staging
            type=sha,prefix=liteti-,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
